apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventix-backend
  namespace: default
  labels:
    app: eventix-backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eventix-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: eventix-backend
        tier: api
    spec:
      containers:
      - name: eventix-backend
        image: aakshat123/eventix-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - secretRef:
            name: eventix-backend-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
