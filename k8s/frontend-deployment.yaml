apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventix-frontend
  namespace: default
  labels:
    app: eventix-frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eventix-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: eventix-frontend
        tier: web
    spec:
      containers:
      - name: eventix-frontend
        image: aakshat123/eventix-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
